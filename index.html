<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocolo GOAT | Sistema Ativado</title>

<style>
/* RESET & CYBER VISUAL */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #000;
    color: #e5e5e5;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
}

.container { max-width: 600px; margin: auto; padding: 20px; }

/* FRASE FLUTUANTE (DICA DE TOQUE) */
.floating-hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 9999;
    background: rgba(0, 255, 65, 0.1);
    backdrop-filter: blur(5px);
    border: 1px solid #00ff41;
    padding: 15px 25px;
    border-radius: 50px;
    color: #fff;
    font-weight: 900;
    text-transform: uppercase;
    font-size: 16px;
    white-space: nowrap;
    box-shadow: 0 0 20px #00ff41;
    pointer-events: none; /* Deixa o clique passar para o botão abaixo */
    animation: floatAnim 2s infinite ease-in-out;
}

@keyframes floatAnim {
    0%, 100% { transform: translate(-50%, -60%); opacity: 0.8; }
    50% { transform: translate(-50%, -40%); opacity: 1; }
}

/* HEADER */
.header-elite { text-align: center; padding: 30px 20px 10px; }
.profile-thumb {
    width: 70px; height: 70px;
    border-radius: 50%;
    border: 3px solid #ff0000;
    box-shadow: 0 0 20px #ff0000;
    margin-bottom: 15px;
}
.main-glow-title {
    font-size: 26px; font-weight: 900;
    color: #fff; text-transform: uppercase; letter-spacing: 3px;
    text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000;
}

/* VIDEO BOX */
.video-box {
    border: 4px solid #00ffff;
    border-radius: 25px;
    box-shadow: 0 0 30px rgba(0,255,255,.5);
    margin-bottom: 15px;
    position: relative;
    width: 100%; aspect-ratio: 16/9;
    overflow: hidden; background: #000;
}
.video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

/* TERMINAL TEXT (TYPING) */
.typing-container { height: 40px; text-align: center; margin-bottom: 20px; }
#typing-text {
    color: #00ff41;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: bold;
    text-transform: uppercase;
    text-shadow: 0 0 5px #00ff41;
}

/* MÓDULOS NEON */
.module-btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 18px; margin-bottom: 10px;
    background: rgba(0, 0, 0, 0.4);
    border: 3px solid #00ff41;
    border-radius: 15px;
    color: #00ff41;
    font-size: 14px; font-weight: 900;
    text-transform: uppercase; letter-spacing: 1px;
    cursor: pointer;
    animation: pulseGreen 1.5s infinite alternate ease-in-out;
}
.module-btn.blue { border-color: #00ffff; color: #00ffff; animation: pulseBlue 1.5s infinite alternate ease-in-out; }
.module-btn.red { border-color: #ff0000; color: #ff0000; animation: pulseRed 1.5s infinite alternate ease-in-out; }

@keyframes pulseGreen { 0% { box-shadow: 0 0 5px #00ff41; } 100% { box-shadow: 0 0 18px #00ff41; } }
@keyframes pulseBlue { 0% { box-shadow: 0 0 5px #00ffff; } 100% { box-shadow: 0 0 18px #00ffff; } }
@keyframes pulseRed { 0% { box-shadow: 0 0 5px #ff0000; } 100% { box-shadow: 0 0 18px #ff0000; } }

/* SCANNER PDF */
.pdf-scanner {
    width: 100%; height: 160px;
    background: #0a0a0a; border: 1px solid #333;
    border-radius: 15px; position: relative;
    overflow: hidden; margin: 20px 0;
    display: flex; align-items: center; justify-content: center;
}
.scan-line {
    position: absolute; width: 100%; height: 3px;
    background: #ff0000; box-shadow: 0 0 15px #ff0000;
    top: 0; animation: scan 3s infinite linear;
}
@keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

/* PROMO CARD */
.promo-card {
    border: 4px solid #ffcc00; border-radius: 25px;
    padding: 30px 20px; text-align: center;
    background: linear-gradient(145deg, #0a0a0a, #000);
    box-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
    margin-bottom: 50px;
}
.price-main { font-size: 52px; font-weight: 900; color: #ffcc00; text-shadow: 0 0 15px #ffcc00; }
.btn-final {
    background: linear-gradient(to bottom, #ffcc00, #ff9900);
    color: #000; border: none; padding: 20px;
    border-radius: 15px; font-weight: 900; width: 100%;
    text-transform: uppercase; cursor: pointer;
}

/* OVERLAY FINAL */
#overlay {
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.98); z-index:10000; flex-direction:column; align-items:center; justify-content:center;
}
.bar-bg { width: 200px; height: 4px; background: #111; margin-top: 20px; border-radius: 10px; overflow: hidden;}
.bar-fill { width: 0%; height: 100%; background: #ffcc00; }
</style>
</head>
<body onclick="handleFirstClick()">

<div id="hint" class="floating-hint">
    👉🏼📲 Toque na tela
</div>

<div id="overlay">
    <div id="loading-text" style="color:#00ff41; font-family:monospace;">CRIPTOGRAFANDO ACESSO...</div>
    <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
    <div id="goat-msg" style="color:#fff; font-weight:900; margin-top:20px; display:none;">VOCÊ ESTÁ A UM PASSO DE SER UM GOAT 🐐</div>
</div>

<div class="header-elite">
    <img src="https://imgur.com/PoxJsyD.png" class="profile-thumb">
    <h1 class="main-glow-title">PROTOCOLO GOAT</h1>
</div>

<div class="container">
    <div class="video-box">
        <iframe id="goatVideo" src="https://www.youtube.com/embed/MkY7ajtJp0U?autoplay=1&mute=1&controls=0&rel=0&enablejsapi=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="typing-container">
        <span id="typing-text"></span>
    </div>

    <button class="module-btn" onclick="scrollToBuy()">💻 01. ACESSO_AO_SISTEMA</button>
    <button class="module-btn blue" onclick="scrollToBuy()">⚡ 02. ACELERADOR_VISUAL</button>
    <button class="module-btn red" onclick="scrollToBuy()">🔥 03. O_SEGREDO_GOAT</button>

    <div class="pdf-scanner">
        <div class="scan-line"></div>
        <div style="filter: blur(5px); opacity: 0.3; font-size: 10px;">[DADOS CONFIDENCIAIS BLOQUEADOS]</div>
        <div style="position: absolute; color: #fff; font-weight: bold; background: rgba(255,0,0,0.7); padding: 5px 10px; border-radius: 4px;">PDF BLOQUEADO</div>
    </div>

    <div class="promo-card" id="oferta">
        <div class="price-box">
            <span style="font-size: 14px; display: block; color: #555; text-decoration: line-through;">De R$ 97,00 por</span>
            <span class="price-main">R$ 29,90</span>
        </div>
        <button class="btn-final" onclick="triggerAccess()">LIBERAR MEU ACESSO</button>
    </div>
</div>

<script>
// LÓGICA DO PRIMEIRO CLIQUE (ATIVAR SOM E SUMIR FRASE)
function handleFirstClick() {
    const video = document.getElementById('goatVideo');
    video.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
    video.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    
    const hint = document.getElementById('hint');
    if(hint) hint.style.display = 'none';
}

// TYPING EFFECT
const phrases = ["SISTEMA GOAT ATIVO...", "DECODIFICANDO PADRÕES...", "ACESSO ELITE LIBERADO..."];
let pIdx = 0, charIdx = 0, isDel = false;
function type() {
    const target = document.getElementById("typing-text");
    const full = phrases[pIdx];
    target.innerHTML = isDel ? full.substring(0, charIdx--) : full.substring(0, charIdx++);
    if (!isDel && charIdx > full.length) { setTimeout(() => isDel = true, 2000); }
    else if (isDel && charIdx < 0) { isDel = false; pIdx = (pIdx + 1) % phrases.length; charIdx = 0; }
    setTimeout(type, isDel ? 50 : 100);
}
window.onload = type;

function scrollToBuy() {
    document.getElementById('oferta').scrollIntoView({ behavior: 'smooth' });
}

function triggerAccess() {
    document.getElementById('overlay').style.display = 'flex';
    let w = 0;
    const interval = setInterval(() => {
        if (w >= 100) {
            clearInterval(interval);
            document.getElementById('loading-text').style.display = 'none';
            document.getElementById('goat-msg').style.display = 'block';
            setTimeout(() => { window.location.href = "https://pay.hotmart.com/L103950840Q"; }, 2500);
        } else {
            w += 2; document.getElementById('bar').style.width = w + '%';
        }
    }, 40);
}
</script>

</body>
</html>
