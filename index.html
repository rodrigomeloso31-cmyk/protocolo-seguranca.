<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocolo GOAT | Sistema Ativado</title>

<style>
/* ESTÉTICA GOAT - DARK MODE */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #000;
    color: #e5e5e5;
    font-family: 'Segoe UI', Roboto, sans-serif;
    overflow-x: hidden;
    cursor: pointer; /* Indica que a página toda é interativa */
}

.container { max-width: 600px; margin: auto; padding: 20px; }

/* HEADER */
.header-elite { text-align: center; padding: 20px 20px 10px; }
.profile-thumb {
    width: 65px; height: 65px;
    border-radius: 50%;
    border: 2px solid #ff0000;
    box-shadow: 0 0 15px #ff0000;
    margin-bottom: 10px;
}
.main-glow-title {
    font-size: 24px; font-weight: 900;
    color: #fff; text-transform: uppercase; letter-spacing: 2px;
    text-shadow: 0 0 10px #ff0000;
}

/* VIDEO BOX (PROTEGIDA) */
.video-box {
    border: 3px solid #00ffff;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(0,255,255,.3);
    margin-bottom: 10px;
    position: relative;
    width: 100%; aspect-ratio: 16/9;
    overflow: hidden; background: #000;
    pointer-events: none; /* Bloqueia cliques diretos no iframe para não sair da página */
}
.video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

/* FRASE DE COMANDO (FORA DO VÍDEO) */
#hint-tap {
    text-align: center;
    background: linear-gradient(90deg, transparent, rgba(0,255,65,0.2), transparent);
    color: #00ff41;
    padding: 15px;
    font-weight: 900;
    text-transform: uppercase;
    font-size: 18px;
    letter-spacing: 1px;
    margin-bottom: 20px;
    animation: pulseText 1.5s infinite;
    cursor: pointer;
}

@keyframes pulseText {
    0% { transform: scale(1); text-shadow: 0 0 5px #00ff41; }
    50% { transform: scale(1.05); text-shadow: 0 0 20px #00ff41; }
    100% { transform: scale(1); text-shadow: 0 0 5px #00ff41; }
}

/* TYPING TEXT */
.typing-container { height: 35px; text-align: center; margin-bottom: 20px; }
#typing-text { color: #00ff41; font-family: monospace; font-size: 13px; text-shadow: 0 0 5px #00ff41; }

/* BOTÕES NEON */
.module-btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 18px; margin-bottom: 12px;
    background: #000;
    border: 2px solid #00ff41;
    border-radius: 12px;
    color: #00ff41;
    font-size: 14px; font-weight: 900;
    text-transform: uppercase;
    cursor: pointer;
    transition: 0.3s;
}
.module-btn.blue { border-color: #00ffff; color: #00ffff; }
.module-btn.red { border-color: #ff0000; color: #ff0000; }

/* SCANNER PDF */
.pdf-scanner {
    width: 100%; height: 140px;
    background: #0a0a0a; border: 1px solid #333;
    border-radius: 15px; position: relative;
    overflow: hidden; margin: 20px 0;
    display: flex; align-items: center; justify-content: center;
}
.scan-line {
    position: absolute; width: 100%; height: 2px;
    background: #ff0000; box-shadow: 0 0 10px #ff0000;
    top: 0; animation: scan 3s infinite linear;
}
@keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

/* PROMO CARD */
.promo-card {
    border: 3px solid #ffcc00; border-radius: 20px;
    padding: 25px; text-align: center;
    background: #050505;
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
    margin-bottom: 40px;
}
.price-main { font-size: 48px; font-weight: 900; color: #ffcc00; }
.btn-final {
    background: #ffcc00; color: #000; border: none; padding: 20px;
    border-radius: 12px; font-weight: 900; width: 100%;
    text-transform: uppercase; cursor: pointer;
}

/* OVERLAY */
#overlay {
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.98); z-index:10000; flex-direction:column; align-items:center; justify-content:center;
}
.bar-bg { width: 200px; height: 4px; background: #111; margin-top: 20px; }
.bar-fill { width: 0%; height: 100%; background: #ffcc00; transition: width 0.1s; }
</style>
</head>

<body onclick="activateSystem()">

<div id="overlay">
    <div style="color:#00ff41; font-family:monospace;">ATIVANDO PROTOCOLO...</div>
    <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
    <div id="goat-msg" style="color:#fff; font-weight:900; margin-top:20px; display:none; text-align:center;">VOCÊ ESTÁ A UM PASSO DE SER UM GOAT 🐐</div>
</div>

<div class="header-elite">
    <img src="https://imgur.com/PoxJsyD.png" class="profile-thumb">
    <h1 class="main-glow-title">PROTOCOLO GOAT</h1>
</div>

<div class="container">
    <div class="video-box">
        <iframe id="goatVideo" src="https://www.youtube.com/embed/MkY7ajtJp0U?autoplay=1&mute=1&controls=0&rel=0&enablejsapi=1" frameborder="0"></iframe>
    </div>

    <div id="hint-tap">
        👉🏼📲 Toque na tela para ativar o som
    </div>

    <div class="typing-container">
        <span id="typing-text"></span>
    </div>

    <button class="module-btn" onclick="scrollToBuy()">💻 01. ACESSO_AO_SISTEMA</button>
    <button class="module-btn blue" onclick="scrollToBuy()">⚡ 02. ACELERADOR_VISUAL</button>
    <button class="module-btn red" onclick="scrollToBuy()">🔥 03. O_SEGREDO_GOAT</button>

    <div class="pdf-scanner">
        <div class="scan-line"></div>
        <div style="color: #444; font-size: 10px;">[SISTEMA CRIPTOGRAFADO]</div>
    </div>

    <div class="promo-card" id="oferta">
        <span class="price-main">R$ 29,90</span>
        <button class="btn-final" onclick="triggerAccess()">LIBERAR MEU ACESSO</button>
    </div>
</div>

<script>
// FUNÇÃO PARA ATIVAR O SOM (UNMUTE) EM QUALQUER CLIQUE
function activateSystem() {
    const video = document.getElementById('goatVideo');
    // Comando via API do Youtube para tirar o mudo
    video.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
    video.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    
    // Esconde a frase de comando
    const hint = document.getElementById('hint-tap');
    if(hint) hint.style.display = 'none';
}

// EFEITO DE DIGITAÇÃO
const phrases = ["INICIALIZANDO...", "DECODIFICANDO...", "ACESSO LIBERADO..."];
let pIdx = 0, charIdx = 0, isDel = false;
function type() {
    const target = document.getElementById("typing-text");
    const full = phrases[pIdx];
    target.innerHTML = isDel ? full.substring(0, charIdx--) : full.substring(0, charIdx++);
    if (!isDel && charIdx > full.length) { setTimeout(() => isDel = true, 2000); }
    else if (isDel && charIdx < 0) { isDel = false; pIdx = (pIdx + 1) % phrases.length; charIdx = 0; }
    setTimeout(type, isDel ? 50 : 100);
}
window.onload = type;

function scrollToBuy() {
    document.getElementById('oferta').scrollIntoView({ behavior: 'smooth' });
}

function triggerAccess() {
    document.getElementById('overlay').style.display = 'flex';
    let w = 0;
    const interval = setInterval(() => {
        if (w >= 100) {
            clearInterval(interval);
            document.getElementById('goat-msg').style.display = 'block';
            setTimeout(() => { window.location.href = "https://pay.hotmart.com/L103950840Q"; }, 2500);
        } else {
            w += 2; document.getElementById('bar').style.width = w + '%';
        }
    }, 40);
}
</script>

</body>
</html>
