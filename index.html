<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Protocolo de Segurança</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: #000; 
            color: #00ff00; 
            font-family: monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden;
            padding: 10px;
        }
        .terminal { 
            width: 100%; 
            height: 95vh; /* Ocupa quase toda a altura da tela */
            max-width: 450px; 
            padding: 30px 20px; 
            border: 3px solid #00ff00; 
            background: rgba(0, 255, 0, 0.03); 
            border-radius: 15px; 
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Distribui os itens do topo ao fundo */
            box-shadow: inset 0 0 20px rgba(0,255,0,0.2);
        }
        .header-text {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
        }
        .bar-bg { width: 100%; background: #111; height: 20px; border: 1px solid #00ff00; margin: 20px 0; position: relative; }
        .bar-fill { width: 0%; height: 100%; background: #00ff00; transition: width 0.1s; }
        .log { 
            font-size: 14px; 
            flex-grow: 1; /* Faz o log ocupar o espaço do meio */
            overflow: hidden; 
            margin: 20px 0;
            line-height: 1.6;
        }
        #status { text-align: center; font-size: 16px; margin-bottom: 10px; }
        .btn-ready { 
            display: none; 
            width: 100%; 
            background: #00ff00; 
            color: #000; 
            border: none; 
            padding: 22px; 
            font-weight: 900; 
            border-radius: 10px; 
            text-decoration: none; 
            text-align: center; 
            font-size: 18px; 
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 255, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); }
        }
    </style>
</head>

            <a href="https://hotm.io/Protgoat" id="btn" class="btn-ready">LIBERAR ACESSO</a>
        </div>
    </div>
