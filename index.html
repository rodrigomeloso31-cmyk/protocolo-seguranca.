<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
/* Reset para ocupar a tela inteira */
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
html, body { height: 100%; overflow: hidden; background: #000; color: #fff; }
body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding: 10px 0;}

/* Cabeçalho compacto */
.h{text-align:center; flex: 0 1 auto;}
.l{width:45px;height:45px;border-radius:50%;border:1.5px solid red;box-shadow:0 0 10px red;object-fit:cover}
.t{font-size:18px;font-weight:700;margin-top:5px}

/* Container do Vídeo Reduzido */
.v-box{width:85%; max-width:300px; aspect-ratio:9/16; max-height:35vh; border:2px solid #333; border-radius:15px; overflow:hidden; position:relative; background:#111; flex: 0 1 auto;}
.v-box iframe{position:absolute;top:0;left:0;width:100%;height:100%}

/* Boxes Azul Neon Menores */
.c{width:90%; max-width:350px; display:flex; flex-direction:column; gap:8px; flex: 0 1 auto;}
.s{width:100%; padding:10px; border:2px solid #00f2ff; border-radius:20px; display:flex; align-items:center; gap:10px; box-shadow:0 0-8px #00f2ff; animation:pB 2s infinite}
@keyframes pB{0%,100%{box-shadow:0 0 3px #00f2ff}50%{box-shadow:0 0 12px #00f2ff}}
.s h2{color:#00f2ff; font-size:12px; text-transform:uppercase}
.s p{font-size:10px; color:#fff}
.icon{font-size:18px}

/* Botão Próximo ao Vídeo */
.btn{width:90%; max-width:350px; background:none; color:#f00; padding:15px; font-size:14px; font-weight:900; border-radius:40px; border:2.5px solid #f00; text-transform:uppercase; box-shadow:0 0 10px #f00; animation:pR 1.5s infinite; flex: 0 1 auto;}
@keyframes pR{0%,100%{transform:scale(1)}50%{transform:scale(1.03);box-shadow:0 0 20px #f00}}

/* Loading */
#o{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99;flex-direction:column;align-items:center;justify-content:center}
.b{width:70%;height:3px;background:#111;margin-top:15px;overflow:hidden;border:1px solid red}.g{width:0;height:100%;background:red;animation:load 2s forwards}@keyframes load{to{width:100%}}
</style>
</head>
<body>
<div id="o"><div style="color:red;font-size:10px">PROCESSANDO...<div class="b"><div class="g"></div></div></div></div>

<div class="h">
    <img src="https://imgur.com/PoxJsyD.png" class="l">
    <div class="t">Protocolo <span style="color:red">Goat</span></div>
</div>

<div class="v-box">
    <iframe src="https://www.youtube.com/embed/MkY7ajtJp0U?autoplay=1&rel=0" frameborder="0" allow="autoplay;encrypted-media" allowfullscreen></iframe>
</div>

<div class="c">
    <div class="s"><span class="icon">🛡️</span><div><h2>Acelerador Visual</h2><p>Domine a retenção com impacto.</p></div></div>
    <div class="s"><span class="icon">🗝️</span><div><h2 style="color:#fff">Domínio da I.A</h2><p>Prompts para baixar seu CPA.</p></div></div>
</div>

</body>
</html>
