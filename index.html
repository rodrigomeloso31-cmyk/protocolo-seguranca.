<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo GOAT | Secure Interface</title>
    <style>
        :root { --accent: #00ff41; --bg: #000; --card: #0a0a0a; --border: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', -apple-system, sans-serif; overflow-x: hidden; }

        /* BACKGROUND MATRIX SUTIL */
        canvas#matrix { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.12; }

        /* HEADER PROFISSIONAL */
        .header { text-align: center; padding: 50px 20px 20px; }
        .profile-thumb { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--border); margin-bottom: 20px; object-fit: cover; }
        .title { font-size: 22px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; color: #fff; }

        .container { max-width: 500px; margin: auto; padding: 20px; position: relative; z-index: 1; }

        /* VIDEO ENGINE */
        .video-frame { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        .video-frame iframe { position: absolute; width: 100%; height: 100%; pointer-events: none; }
        
        #unmute-btn { width: 100%; padding: 15px; background: rgba(0, 255, 65, 0.05); border: 1px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; margin-bottom: 30px; transition: 0.3s; }
        #unmute-btn:hover { background: var(--accent); color: #000; }

        /* MÓDULOS CIBERNÉTICOS */
        .module-item { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; }
        .module-num { font-family: monospace; color: var(--accent); margin-right: 15px; font-size: 14px; font-weight: bold; }
        .module-text { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #bbb; text-transform: uppercase; }

        /* PDF FAKE INTERATIVO */
        .pdf-box { background: #080808; border: 1px dashed #222; padding: 25px; border-radius: 8px; margin: 30px 0; text-align: center; }
        .pdf-status { font-size: 10px; color: var(--accent); font-family: monospace; margin-bottom: 12px; letter-spacing: 1px; }
        .pdf-progress-bg { width: 100%; height: 2px; background: #111; position: relative; }
        .pdf-progress-fill { position: absolute; height: 100%; background: var(--accent); width: 0%; transition: 0.2s; }

        /* ÁREA DE CHECKOUT */
        .checkout { margin-top: 40px; padding: 40px 0; border-top: 1px solid var(--border); text-align: center; }
        .price-label { font-size: 14px; color: #666; margin-bottom: 5px; font-weight: bold; }
        .price-main { font-size: 56px; font-weight: 800; color: #fff; margin-bottom: 5px; letter-spacing: -2px; }
        .price-cash { font-size: 12px; color: #444; margin-bottom: 30px; letter-spacing: 1px; }
        
        .btn-buy { background: #fff; color: #000; border: none; padding: 22px; width: 100%; border-radius: 4px; font-weight: 900; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; }
        .btn-buy:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 255, 65, 0.1); }

        /* OVERLAY LOADING */
        #overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:10000; flex-direction:column; align-items:center; justify-content:center; }
        .loader-bar { width: 180px; height: 1px; background: #111; margin-top: 20px; }
        .loader-fill { height: 100%; background: var(--accent); width: 0%; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="header">
        <img src="https://files.imagetourl.net/uploads/1769555414520-93412662-bce8-4561-87c7-8f8b0745bb1e.jpeg" class="profile-thumb">
        <h1 class="title">PROTOCOLO GOAT</h1>
    </div>

    <div class="container">
        <div class="video-frame">
            <iframe id="video-player" src="https://www.youtube.com/embed/MkY7ajtJp0U?autoplay=1&mute=1&controls=0&rel=0&enablejsapi=1" frameborder="0"></iframe>
        </div>
        
        <button id="unmute-btn" onclick="activateSystem()">[ ATIVAR ÁUDIO DO PROTOCOLO ]</button>

        <div class="module-item"><span class="module-num">01</span><span class="module-text">Acelerador Visual 2.0</span></div>
        <div class="module-item"><span class="module-num">02</span><span class="module-text">Engenharia Visual Advanced</span></div>
        <div class="module-item"><span class="module-num">03</span><span class="module-text">Domínio Estratégico de I.A</span></div>

        <div class="pdf-box">
            <div class="pdf-status" id="pdf-status">DESCRIPTOGRAFANDO_ARQUIVOS_GOAT.EXE...</div>
            <div class="pdf-progress-bg"><div class="pdf-progress-fill" id="pdf-fill"></div></div>
        </div>

        <div class="checkout">
            <p class="price-label">6x de</p>
            <div class="price-main">R$ 8,99</div>
            <p class="price-cash">ou à vista R$ 47,90</p>
            <button class="btn-buy" onclick="redirectHotmart()">Liberar Acesso Agora</button>
        </div>
    </div>

    <div id="overlay">
        <div style="font-size: 10px; color: var(--accent); letter-spacing: 3px; font-family: monospace;">ENCRYPTING_PAYMENT_GATEWAY...</div>
        <div class="loader-bar"><div class="loader-fill" id="overlay-fill"></div></div>
    </div>

    <script>
        // MATRIX ANIMATION
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const bin = "01"; const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#001a00"; ctx.font = fontSize + "px monospace";
            drops.forEach((y, i) => {
                const text = bin[Math.floor(Math.random() * bin.length)];
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 70);

        // PDF PROGRESS
        let pW = 0;
        const pInterval = setInterval(() => {
            if(pW < 100) { pW += 0.4; document.getElementById('pdf-fill').style.width = pW + '%'; }
            else { 
                document.getElementById('pdf-status').innerText = 'PROTOCOLO_DE_SISTEMA_COMPLETO'; 
                clearInterval(pInterval);
            }
        }, 150);

        // YOUTUBE API COMMANDS
        function activateSystem() {
            const frame = document.getElementById('video-player');
            frame.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
            frame.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            document.getElementById('unmute-btn').style.display = 'none';
        }

        // REDIRECT LOGIC
        function redirectHotmart() {
            document.getElementById('overlay').style.display = 'flex';
            let w = 0;
            const interval = setInterval(() => {
                if (w >= 100) { 
                    clearInterval(interval); 
                    window.location.href = "https://pay.hotmart.com/L103950840Q?off=55x6x7d1"; 
                }
                else { w += 5; document.getElementById('overlay-fill').style.width = w + '%'; }
            }, 50);
        }

        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    </script>
</body>
</html>
